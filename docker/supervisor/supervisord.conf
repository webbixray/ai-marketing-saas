# Supervisor Configuration
# =============================================

[supervisord]
nodaemon = true
logfile = /var/log/supervisor/supervisord.log
logfile_maxbytes = 50MB
logfile_backups = 10
loglevel = info
pidfile = /var/run/supervisord.pid
childlogdir = /var/log/supervisor
user = root

[program:php-fpm]
command = /usr/local/sbin/php-fpm -F -R
autostart = true
autorestart = true
startsecs = 5
startretries = 3
stdout_logfile = /var/log/supervisor/php-fpm.log
stderr_logfile = /var/log/supervisor/php-fpm.err.log
user = appuser
priority = 10

[program:nginx]
command = /usr/sbin/nginx -g "daemon off;"
autostart = true
autorestart = true
startsecs = 3
startretries = 3
stdout_logfile = /var/log/supervisor/nginx.log
stderr_logfile = /var/log/supervisor/nginx.err.log
user = root
priority = 20

[program:queue-worker]
command = php /var/www/html/artisan queue:work --sleep=3 --tries=3 --timeout=60 --max-jobs=1000 --max-time=3600
autostart = true
autorestart = true
startsecs = 5
startretries = 3
stdout_logfile = /var/log/supervisor/queue-worker.log
stderr_logfile = /var/log/supervisor/queue-worker.err.log
user = appuser
numprocs = 2
process_name = queue-worker-%(process_num)02d
priority = 30

[program:schedule-worker]
command = php /var/www/html/artisan schedule:work
autostart = true
autorestart = true
startsecs = 5
startretries = 3
stdout_logfile = /var/log/supervisor/schedule-worker.log
stderr_logfile = /var/log/supervisor/schedule-worker.err.log
user = appuser
priority = 40

[program:reverb]
command = php /var/www/html/artisan reverb:start --host=0.0.0.0 --port=8080
autostart = true
autorestart = true
startsecs = 5
startretries = 3
stdout_logfile = /var/log/supervisor/reverb.log
stderr_logfile = /var/log/supervisor/reverb.err.log
user = appuser
priority = 50