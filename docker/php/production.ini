; Production PHP Configuration
; =============================================

; Security
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/php/error.log
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Performance
max_execution_time = 60
max_input_time = 60
memory_limit = 256M
post_max_size = 16M
upload_max_filesize = 16M
max_file_uploads = 20

; Session Security
session.cookie_secure = On
session.cookie_httponly = On
session.cookie_samesite = "Strict"
session.use_strict_mode = On
session.gc_maxlifetime = 7200
session.gc_probability = 1
session.gc_divisor = 1000

; OPcache (see opcache.ini for details)
opcache.enable = 1
opcache.enable_cli = 1

; Realpath cache
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Timezone
date.timezone = "UTC"

; File uploads
file_uploads = On
max_input_vars = 3000

; Disable dangerous functions
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,curl_exec,curl_multi_exec,parse_ini_file,show_source,pcntl_exec,pcntl_fork,pcntl_signal,pcntl_waitpid,pcntl_wexitstatus,pcntl_wifexited,pcntl_wifsignaled,pcntl_wifstopped,pcntl_wstopsig,pcntl_wtermsig,pcntl_sigtimedwait,pcntl_sigwaitinfo,pcntl_get_last_error,pcntl_strerror,pcntl_async_signals